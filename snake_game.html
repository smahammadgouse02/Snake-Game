
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            color: #38ef7d;
            margin-bottom: 15px;
        }

        .score {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            background: #071b16;
            border: 4px solid #38ef7d;
            border-radius: 8px;
            max-width: 100%;
        }

        button {
            background: #38ef7d;
            color: #111;
            border: none;
            padding: 12px 25px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #20c96b;
        }

        p {
            margin-top: 12px;
            color: #ddd;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🐍 Snake Game</h1>

        <div class="score">
            Score: <span id="score">0</span>
        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <br>

        <button onclick="startGame()">Start / Restart</button>

        <p>Use Arrow Keys ⬆ ⬇ ⬅ ➡ to move the snake.</p>

    </div>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const box = 20;

        let snake;
        let food;
        let direction;
        let score;
        let gameInterval;
        let running = false;

        function startGame() {

            clearInterval(gameInterval);

            snake = [
                { x: 200, y: 200 },
                { x: 180, y: 200 },
                { x: 160, y: 200 }
            ];

            direction = "RIGHT";
            score = 0;
            running = true;

            document.getElementById("score").innerText = score;

            createFood();

            gameInterval = setInterval(drawGame, 120);
        }

        function createFood() {

            food = {
                x: Math.floor(Math.random() * 20) * box,
                y: Math.floor(Math.random() * 20) * box
            };

            if (snake.some(part => part.x === food.x && part.y === food.y)) {
                createFood();
            }
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp" && direction !== "DOWN") {
                direction = "UP";
            }

            else if (event.key === "ArrowDown" && direction !== "UP") {
                direction = "DOWN";
            }

            else if (event.key === "ArrowLeft" && direction !== "RIGHT") {
                direction = "LEFT";
            }

            else if (event.key === "ArrowRight" && direction !== "LEFT") {
                direction = "RIGHT";
            }

        });

        function drawGame() {

            ctx.fillStyle = "#071b16";
            ctx.fillRect(0, 0, 400, 400);

            // Draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            // Draw snake
            snake.forEach((part, index) => {

                ctx.fillStyle = index === 0 ? "#38ef7d" : "#20c96b";

                ctx.fillRect(part.x, part.y, box - 2, box - 2);

            });

            let headX = snake[0].x;
            let headY = snake[0].y;

            if (direction === "UP") headY -= box;
            if (direction === "DOWN") headY += box;
            if (direction === "LEFT") headX -= box;
            if (direction === "RIGHT") headX += box;

            // Check food collision
            if (headX === food.x && headY === food.y) {

                score += 10;

                document.getElementById("score").innerText = score;

                createFood();

            } else {

                snake.pop();

            }

            const newHead = {
                x: headX,
                y: headY
            };

            // Check wall and self collision
            if (
                headX < 0 ||
                headY < 0 ||
                headX >= 400 ||
                headY >= 400 ||
                snake.some(part => part.x === headX && part.y === headY)
            ) {

                endGame();
                return;

            }

            snake.unshift(newHead);

        }

        function endGame() {

            clearInterval(gameInterval);
            running = false;

            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER!", 200, 190);

            ctx.font = "18px Arial";
            ctx.fillText("Your Score: " + score, 200, 225);

        }

        // Start automatically
        startGame();

    </script>

</body>
</html>
